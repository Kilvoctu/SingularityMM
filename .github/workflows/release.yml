name: Singularity Release

# Trigger the workflow when you push a tag (e.g., v1.0.0)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v2.2.9)"
        required: true
        type: string

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # WINDOWS BUILD
          - platform: "windows-latest"
            args: "" # Default builds .msi/.exe + updater files

          # LINUX BUILD
          - platform: "ubuntu-22.04"
            args: "" # Default builds .deb/.AppImage + updater files

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # --- LINUX DEPENDENCIES (Only runs on Ubuntu) ---
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

      # --- RUST SETUP ---
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      # --- NODE SETUP ---
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Validate dispatch version input
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.version }}" in
            v*) echo "OK: release tag ${{ inputs.version }}" ;;
            *) echo "::error::version input must start with 'v' (e.g. v2.2.9), got: ${{ inputs.version }}"; exit 1 ;;
          esac
        shell: bash

      - name: Derive app version from release tag
        id: appver
        run: |
          APP_VERSION="${TAG_NAME#v}"
          echo "{\"version\":\"$APP_VERSION\"}" > tauri.conf.override.json
          echo "tauri_args=--config tauri.conf.override.json" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"
        shell: bash

      # --- BUILD, SIGN, AND UPLOAD ---
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: "Singularity ${{ env.TAG_NAME }}"
          releaseBody: "Automatic release for version ${{ env.TAG_NAME }}"
          releaseDraft: true
          prerelease: false
          args: ${{ steps.appver.outputs.tauri_args }}

      # --- RENAME AND UPLOAD PORTABLE ---
      - name: Rename and Upload Portable (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          # Go to the build folder
          cd src-tauri/target/release/

          # Rename the raw file to include "Portable"
          mv Singularity.exe Singularity_Portable_${TAG_NAME}.exe

        shell: bash

      - name: Upload Portable Asset
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          draft: true
          prerelease: false
          files: src-tauri/target/release/Singularity_Portable_${{ env.TAG_NAME }}.exe
